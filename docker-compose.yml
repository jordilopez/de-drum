services:
  de-drum:
    build:
      context: .
      dockerfile: Dockerfile
    image: de-drum:latest
    container_name: de-drum
    restart: unless-stopped

    # ── Ports ───────────────────────────────────────────────────────
    ports:
      - '7860:7860'

    # ── Volumes ─────────────────────────────────────────────────────
    volumes:
      # Persist separated audio
      - ./output:/app/output
      # Persist model cache (avoids re-downloading Demucs ~2GB on each run)
      - cache:/cache
      # Optional: mount a local .env for OPENROUTER_API_KEY
      - ./.env:/app/.env:ro

    # ── Environment ─────────────────────────────────────────────────
    environment:
      - GRADIO_SERVER_NAME=0.0.0.0
      - GRADIO_SERVER_PORT=7860

    # ── GPU ─────────────────────────────────────────────────────────
    # Uncomment the lines below if you have an NVIDIA GPU with the
    # nvidia-container-toolkit installed on the host:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

    # ── Health ──────────────────────────────────────────────────────
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:7860/healthz')",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s

volumes:
  cache:
